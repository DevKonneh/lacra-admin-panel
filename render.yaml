services:
  - type: web
    name: lacra-admin-panel
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lacra-eudr-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
